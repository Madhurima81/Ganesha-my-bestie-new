<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scene 2 Layout Editor</title>
  <style>
    :root {
      --panel: #f7f1e8;
      --ink: #2b2b2b;
      --accent: #d8862c;
      --line: #d8c9b7;
      --bg: #fffaf4;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
      overflow: auto;
    }

    .preview-wrap {
      padding: 16px;
      overflow: auto;
    }

    h1, h2, h3, p { margin: 0 0 12px; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; margin-top: 20px; }
    h3 { font-size: 14px; margin-top: 14px; }
    p, label, button, input, select, textarea { font-size: 14px; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .group {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 12px;
      margin-bottom: 12px;
    }

    .control {
      display: grid;
      grid-template-columns: 72px 1fr 56px;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .control:last-child { margin-bottom: 0; }

    .control output {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .preview {
      position: relative;
      width: min(100%, 1180px);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    .asset {
      position: absolute;
      transform: translate(-50%, -50%);
      user-select: none;
      touch-action: none;
      cursor: grab;
    }

    .asset img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .asset.dragging {
      cursor: grabbing;
      z-index: 30;
    }

    .asset-label {
      position: absolute;
      left: 50%;
      top: calc(100% + 6px);
      transform: translateX(-50%);
      background: rgba(20, 28, 40, 0.6);
      color: #fff;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
    }

    .guide {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 10% 10%, 10% 10%;
      opacity: 0;
    }

    .guide.show { opacity: 1; }

    textarea {
      width: 100%;
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      resize: vertical;
      background: #fffdf9;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .hidden { display: none; }

    .hop-point {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #d8862c;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      z-index: 25;
    }

    .hop-point.dragging {
      cursor: grabbing;
    }

    .hop-point::after {
      content: attr(data-index);
      position: absolute;
      left: 50%;
      top: -20px;
      transform: translateX(-50%);
      font-size: 11px;
      color: #fff;
      background: rgba(20,28,40,0.7);
      padding: 2px 6px;
      border-radius: 999px;
      pointer-events: none;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Scene 2 Layout Editor</h1>
      <p>Tune positions and sizes for `SuryakotiGame` and `SamaprabhaGame`, then copy the values back into the code.</p>

      <div class="tabs">
        <button class="tab active" data-scene="suryakoti">Suryakoti</button>
        <button class="tab" data-scene="samaprabha">Samaprabha</button>
      </div>

      <div class="group">
        <label><input id="show-guides" type="checkbox" /> Show 10% guides</label>
      </div>

      <div id="controls-suryakoti">
        <div class="group">
          <h2>Bunny</h2>
          <div class="control"><label for="surya-bunny-l">left</label><input id="surya-bunny-l" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="surya-bunny-t">top</label><input id="surya-bunny-t" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="surya-bunny-w">width</label><input id="surya-bunny-w" type="range" min="2" max="24" step="0.5"><output></output></div>
        </div>

        <div class="group">
          <h2>Burrow</h2>
          <div class="control"><label for="surya-burrow-l">left</label><input id="surya-burrow-l" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="surya-burrow-t">top</label><input id="surya-burrow-t" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="surya-burrow-w">width</label><input id="surya-burrow-w" type="range" min="4" max="28" step="0.5"><output></output></div>
        </div>

        <div class="group">
          <h2>Hop Path</h2>
          <p>These are the four intermediate hop points.</p>
          <div id="hop-controls"></div>
        </div>
      </div>

      <div id="controls-samaprabha" class="hidden">
        <div class="group">
          <h2>Left Bird</h2>
          <div class="control"><label for="sama-left-l">left</label><input id="sama-left-l" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="sama-left-t">top</label><input id="sama-left-t" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="sama-bird-w">width</label><input id="sama-bird-w" type="range" min="4" max="26" step="0.5"><output></output></div>
        </div>

        <div class="group">
          <h2>Right Bird</h2>
          <div class="control"><label for="sama-right-l">left</label><input id="sama-right-l" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="sama-right-t">top</label><input id="sama-right-t" type="range" min="0" max="100" step="0.5"><output></output></div>
        </div>

        <div class="group">
          <h2>Sun</h2>
          <div class="control"><label for="sama-sun-l">left</label><input id="sama-sun-l" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="sama-sun-t">top</label><input id="sama-sun-t" type="range" min="0" max="100" step="0.5"><output></output></div>
          <div class="control"><label for="sama-sun-w">width</label><input id="sama-sun-w" type="range" min="4" max="20" step="0.5"><output></output></div>
        </div>
      </div>

      <div class="group">
        <h2>Generated Values</h2>
        <textarea id="output" readonly></textarea>
        <div class="row">
          <button class="primary" id="copy-output">Copy</button>
          <button id="reset-values">Reset</button>
        </div>
      </div>
    </aside>

    <main class="preview-wrap">
      <div id="preview-suryakoti" class="preview"
        style="background-image:url('../src/zones/shloka-river/scenes/Scene2/assets/images/saurakoti-bg.png')">
        <div class="guide"></div>
        <div id="surya-bunny" class="asset">
          <img src="../src/zones/shloka-river/scenes/Scene2/assets/images/Suryakoti/bunny-happy-zip.png" alt="">
          <div class="asset-label">bunny</div>
        </div>
        <div id="surya-burrow" class="asset">
          <img src="../src/zones/shloka-river/scenes/Scene2/assets/images/Suryakoti/burrow-zip.png" alt="">
          <div class="asset-label">burrow</div>
        </div>
        <div id="hop-layer"></div>
      </div>

      <div id="preview-samaprabha" class="preview hidden"
        style="background-image:url('../src/zones/shloka-river/scenes/Scene2/assets/images/saurakoti-bg.png')">
        <div class="guide"></div>
        <div id="sama-left-bird" class="asset">
          <img src="../src/zones/shloka-river/scenes/Scene2/assets/images/Suryakoti/bird-cold.png" alt="">
          <div class="asset-label">left bird</div>
        </div>
        <div id="sama-right-bird" class="asset">
          <img src="../src/zones/shloka-river/scenes/Scene2/assets/images/Suryakoti/bird-warm.png" alt="">
          <div class="asset-label">right bird</div>
        </div>
        <div id="sama-sun" class="asset">
          <img src="../src/zones/shloka-river/scenes/Scene2/assets/images/Suryakoti/sun-zip.png" alt="">
          <div class="asset-label">sun</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const defaults = {
      suryakoti: {
        bunny: { l: 15, t: 56, w: 8 },
        burrow: { l: 83, t: 61, w: 14 },
        hops: [
          { l: 32, t: 51 },
          { l: 52, t: 55 },
          { l: 69, t: 52 },
          { l: 83, t: 61 }
        ]
      },
      samaprabha: {
        leftBird: { l: 22, t: 58 },
        rightBird: { l: 78, t: 57 },
        birdW: 18,
        sun: { l: 50, t: 16, w: 9 }
      }
    };

    const state = JSON.parse(JSON.stringify(defaults));
    const output = document.getElementById('output');
    const hopLayer = document.getElementById('hop-layer');

    function setAsset(el, cfg) {
      el.style.left = cfg.l + '%';
      el.style.top = cfg.t + '%';
      if (cfg.w != null) el.style.width = cfg.w + '%';
    }

    function renderSuryakoti() {
      setAsset(document.getElementById('surya-bunny'), state.suryakoti.bunny);
      setAsset(document.getElementById('surya-burrow'), state.suryakoti.burrow);
      renderHopPoints();
    }

    function renderSamaprabha() {
      setAsset(document.getElementById('sama-left-bird'), { ...state.samaprabha.leftBird, w: state.samaprabha.birdW });
      setAsset(document.getElementById('sama-right-bird'), { ...state.samaprabha.rightBird, w: state.samaprabha.birdW });
      setAsset(document.getElementById('sama-sun'), state.samaprabha.sun);
    }

    function renderOutput() {
      output.value = `SuryakotiGame.jsx\nconst POS = ${JSON.stringify({
  bunny: state.suryakoti.bunny,
  burrow: state.suryakoti.burrow
}, null, 2)};\nconst HOP_PATH = ${JSON.stringify(state.suryakoti.hops, null, 2)};\n\nSamaprabhaGame.css\n.sama-bird.left {\n  left: ${state.samaprabha.leftBird.l}%;\n  top: ${state.samaprabha.leftBird.t}%;\n}\n\n.sama-bird.right {\n  left: ${state.samaprabha.rightBird.l}%;\n  top: ${state.samaprabha.rightBird.t}%;\n}\n\n.sama-bird {\n  width: min(${state.samaprabha.birdW}vw, 190px);\n}\n\nSamaprabhaGame.jsx / CSS\nSun position: left ${state.samaprabha.sun.l}%, top ${state.samaprabha.sun.t}%, width ${state.samaprabha.sun.w}%`;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function roundHalf(value) {
      return Math.round(value * 2) / 2;
    }

    function enableDrag(el, { getPreview, onMove }) {
      el.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const preview = getPreview();
        if (!preview) return;
        el.classList.add('dragging');
        el.setPointerCapture(event.pointerId);

        const handleMove = (moveEvent) => {
          const rect = preview.getBoundingClientRect();
          const xPct = roundHalf(clamp(((moveEvent.clientX - rect.left) / rect.width) * 100, 0, 100));
          const yPct = roundHalf(clamp(((moveEvent.clientY - rect.top) / rect.height) * 100, 0, 100));
          onMove({ xPct, yPct });
        };

        const handleUp = () => {
          el.classList.remove('dragging');
          el.removeEventListener('pointermove', handleMove);
          el.removeEventListener('pointerup', handleUp);
          el.removeEventListener('pointercancel', handleUp);
        };

        el.addEventListener('pointermove', handleMove);
        el.addEventListener('pointerup', handleUp);
        el.addEventListener('pointercancel', handleUp);
      });
    }

    function renderHopPoints() {
      hopLayer.innerHTML = '';
      state.suryakoti.hops.forEach((hop, index) => {
        const point = document.createElement('button');
        point.type = 'button';
        point.className = 'hop-point';
        point.dataset.index = String(index + 1);
        point.style.left = hop.l + '%';
        point.style.top = hop.t + '%';
        enableDrag(point, {
          getPreview: () => document.getElementById('preview-suryakoti'),
          onMove: ({ xPct, yPct }) => {
            state.suryakoti.hops[index].l = xPct;
            state.suryakoti.hops[index].t = yPct;
            const lInput = document.getElementById(`hop-${index}-l`);
            const tInput = document.getElementById(`hop-${index}-t`);
            lInput.value = xPct;
            tInput.value = yPct;
            lInput.parentElement.querySelector('output').textContent = xPct;
            tInput.parentElement.querySelector('output').textContent = yPct;
            renderAll();
          }
        });
        hopLayer.appendChild(point);
      });
    }

    function bindRange(id, getter, setter) {
      const input = document.getElementById(id);
      const out = input.parentElement.querySelector('output');
      const sync = () => {
        const value = Number(input.value);
        setter(value);
        out.textContent = value;
        renderAll();
      };
      input.value = getter();
      out.textContent = input.value;
      input.addEventListener('input', sync);
    }

    bindRange('surya-bunny-l', () => state.suryakoti.bunny.l, v => state.suryakoti.bunny.l = v);
    bindRange('surya-bunny-t', () => state.suryakoti.bunny.t, v => state.suryakoti.bunny.t = v);
    bindRange('surya-bunny-w', () => state.suryakoti.bunny.w, v => state.suryakoti.bunny.w = v);
    bindRange('surya-burrow-l', () => state.suryakoti.burrow.l, v => state.suryakoti.burrow.l = v);
    bindRange('surya-burrow-t', () => state.suryakoti.burrow.t, v => state.suryakoti.burrow.t = v);
    bindRange('surya-burrow-w', () => state.suryakoti.burrow.w, v => state.suryakoti.burrow.w = v);

    const hopControls = document.getElementById('hop-controls');
    state.suryakoti.hops.forEach((hop, index) => {
      const wrap = document.createElement('div');
      wrap.className = 'group';
      wrap.innerHTML = `
        <h3>Hop ${index + 1}</h3>
        <div class="control"><label for="hop-${index}-l">left</label><input id="hop-${index}-l" type="range" min="0" max="100" step="0.5"><output></output></div>
        <div class="control"><label for="hop-${index}-t">top</label><input id="hop-${index}-t" type="range" min="0" max="100" step="0.5"><output></output></div>
      `;
      hopControls.appendChild(wrap);
      bindRange(`hop-${index}-l`, () => state.suryakoti.hops[index].l, v => state.suryakoti.hops[index].l = v);
      bindRange(`hop-${index}-t`, () => state.suryakoti.hops[index].t, v => state.suryakoti.hops[index].t = v);
    });

    bindRange('sama-left-l', () => state.samaprabha.leftBird.l, v => state.samaprabha.leftBird.l = v);
    bindRange('sama-left-t', () => state.samaprabha.leftBird.t, v => state.samaprabha.leftBird.t = v);
    bindRange('sama-right-l', () => state.samaprabha.rightBird.l, v => state.samaprabha.rightBird.l = v);
    bindRange('sama-right-t', () => state.samaprabha.rightBird.t, v => state.samaprabha.rightBird.t = v);
    bindRange('sama-bird-w', () => state.samaprabha.birdW, v => state.samaprabha.birdW = v);
    bindRange('sama-sun-l', () => state.samaprabha.sun.l, v => state.samaprabha.sun.l = v);
    bindRange('sama-sun-t', () => state.samaprabha.sun.t, v => state.samaprabha.sun.t = v);
    bindRange('sama-sun-w', () => state.samaprabha.sun.w, v => state.samaprabha.sun.w = v);

    enableDrag(document.getElementById('surya-bunny'), {
      getPreview: () => document.getElementById('preview-suryakoti'),
      onMove: ({ xPct, yPct }) => {
        state.suryakoti.bunny.l = xPct;
        state.suryakoti.bunny.t = yPct;
        document.getElementById('surya-bunny-l').value = xPct;
        document.getElementById('surya-bunny-t').value = yPct;
        document.getElementById('surya-bunny-l').parentElement.querySelector('output').textContent = xPct;
        document.getElementById('surya-bunny-t').parentElement.querySelector('output').textContent = yPct;
        renderAll();
      }
    });

    enableDrag(document.getElementById('surya-burrow'), {
      getPreview: () => document.getElementById('preview-suryakoti'),
      onMove: ({ xPct, yPct }) => {
        state.suryakoti.burrow.l = xPct;
        state.suryakoti.burrow.t = yPct;
        document.getElementById('surya-burrow-l').value = xPct;
        document.getElementById('surya-burrow-t').value = yPct;
        document.getElementById('surya-burrow-l').parentElement.querySelector('output').textContent = xPct;
        document.getElementById('surya-burrow-t').parentElement.querySelector('output').textContent = yPct;
        renderAll();
      }
    });

    enableDrag(document.getElementById('sama-left-bird'), {
      getPreview: () => document.getElementById('preview-samaprabha'),
      onMove: ({ xPct, yPct }) => {
        state.samaprabha.leftBird.l = xPct;
        state.samaprabha.leftBird.t = yPct;
        document.getElementById('sama-left-l').value = xPct;
        document.getElementById('sama-left-t').value = yPct;
        document.getElementById('sama-left-l').parentElement.querySelector('output').textContent = xPct;
        document.getElementById('sama-left-t').parentElement.querySelector('output').textContent = yPct;
        renderAll();
      }
    });

    enableDrag(document.getElementById('sama-right-bird'), {
      getPreview: () => document.getElementById('preview-samaprabha'),
      onMove: ({ xPct, yPct }) => {
        state.samaprabha.rightBird.l = xPct;
        state.samaprabha.rightBird.t = yPct;
        document.getElementById('sama-right-l').value = xPct;
        document.getElementById('sama-right-t').value = yPct;
        document.getElementById('sama-right-l').parentElement.querySelector('output').textContent = xPct;
        document.getElementById('sama-right-t').parentElement.querySelector('output').textContent = yPct;
        renderAll();
      }
    });

    enableDrag(document.getElementById('sama-sun'), {
      getPreview: () => document.getElementById('preview-samaprabha'),
      onMove: ({ xPct, yPct }) => {
        state.samaprabha.sun.l = xPct;
        state.samaprabha.sun.t = yPct;
        document.getElementById('sama-sun-l').value = xPct;
        document.getElementById('sama-sun-t').value = yPct;
        document.getElementById('sama-sun-l').parentElement.querySelector('output').textContent = xPct;
        document.getElementById('sama-sun-t').parentElement.querySelector('output').textContent = yPct;
        renderAll();
      }
    });

    function renderAll() {
      renderSuryakoti();
      renderSamaprabha();
      renderOutput();
    }

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        const scene = btn.dataset.scene;
        document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b === btn));
        document.getElementById('controls-suryakoti').classList.toggle('hidden', scene !== 'suryakoti');
        document.getElementById('controls-samaprabha').classList.toggle('hidden', scene !== 'samaprabha');
        document.getElementById('preview-suryakoti').classList.toggle('hidden', scene !== 'suryakoti');
        document.getElementById('preview-samaprabha').classList.toggle('hidden', scene !== 'samaprabha');
      });
    });

    document.getElementById('show-guides').addEventListener('change', (e) => {
      document.querySelectorAll('.guide').forEach((guide) => guide.classList.toggle('show', e.target.checked));
    });

    document.getElementById('copy-output').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.value);
      } catch (err) {
        console.error(err);
      }
    });

    document.getElementById('reset-values').addEventListener('click', () => {
      Object.assign(state.suryakoti.bunny, defaults.suryakoti.bunny);
      Object.assign(state.suryakoti.burrow, defaults.suryakoti.burrow);
      state.suryakoti.hops = defaults.suryakoti.hops.map((hop) => ({ ...hop }));
      Object.assign(state.samaprabha.leftBird, defaults.samaprabha.leftBird);
      Object.assign(state.samaprabha.rightBird, defaults.samaprabha.rightBird);
      Object.assign(state.samaprabha.sun, defaults.samaprabha.sun);
      state.samaprabha.birdW = defaults.samaprabha.birdW;
      location.reload();
    });

    renderAll();
  </script>
</body>
</html>
