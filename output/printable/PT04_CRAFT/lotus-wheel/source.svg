<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123">
<defs>
<style>
.title{font-family:DejaVu Sans,sans-serif;font-weight:700;fill:#6B4F43}
.body{font-family:DejaVu Sans,sans-serif;fill:#6F5B52}
.small{font-family:DejaVu Sans,sans-serif;fill:#7B6B63}
.panel{fill:#FFFDF9;stroke:#E6D8CC;stroke-width:2}
.panel-soft{fill:#FFF2E4;stroke:#E8D5C6;stroke-width:2}
.panel-green{fill:#E8F2E4;stroke:#CFE0C8;stroke-width:2}
</style>
</defs>
<rect width="794" height="1123" fill="#FDF9F3"/>
<rect x="24" y="24" width="746" height="1075" rx="28" fill="#FFFDF9" stroke="#E9DDD2" stroke-width="2"/>

<rect x="55" y="50" width="684" height="110" rx="24" class="panel-soft"/>
<text id="TITLE" x="122" y="88" class="title" font-size="30"><tspan x="122" y="71">Lotus Gratitude Growth</tspan><tspan x="122" y="105">Wheel</tspan></text>
<text x="122" y="118" class="small" font-size="13">Make it with your hands. Practise it with your heart.</text>
<g id="MAIN_ART"><image href="data:image/svg+xml;base64," x="606" y="66" width="78" height="78" preserveAspectRatio="xMidYMid meet"/></g>
<g id="DECORATIONS"><image href="data:image/svg+xml;base64," x="560" y="118" width="24" height="24" preserveAspectRatio="xMidYMid meet"/><image href="data:image/svg+xml;base64," x="598" y="118" width="24" height="24" preserveAspectRatio="xMidYMid meet"/><image href="data:image/svg+xml;base64," x="636" y="118" width="24" height="24" preserveAspectRatio="xMidYMid meet"/></g>

<rect x="55" y="190" width="240" height="270" rx="24" class="panel"/>
<text x="85" y="225" class="title" font-size="17">WHAT YOU NEED</text>
<text id="MATERIALS" x="85" y="255" class="body" font-size="14"><tspan x="85" y="258">• paper or cardstock •</tspan><tspan x="85" y="278">colours • scissors •</tspan><tspan x="85" y="298">split pin or string</tspan></text>

<rect x="310" y="190" width="429" height="270" rx="24" class="panel"/>
<text x="340" y="225" class="title" font-size="17">MAKE IT</text>
<text id="STEPS" x="340" y="255" class="body" font-size="14"><tspan x="340" y="238">1. Colour each lotus petal and the gratitude</tspan><tspan x="340" y="258">window. 2. Cut the outer circle and the</tspan><tspan x="340" y="278">pointer. 3. Ask an adult to help you make the</tspan><tspan x="340" y="298">centre hole. 4. Spin the wheel and say one</tspan><tspan x="340" y="318">gratitude thought each time it stops.</tspan></text>

<rect x="55" y="490" width="684" height="355" rx="28" class="panel"/>
<text x="397" y="525" text-anchor="middle" class="title" font-size="18">CRAFT TEMPLATE</text>
<text x="397" y="550" text-anchor="middle" class="small" font-size="12">Cut solid-outlined parts. Fold only where the fold guide appears.</text>
<g id="CRAFT_GEOMETRY"><g id="craft-wheel"><circle cx="397" cy="675" r="108" fill="#FFF7EF" stroke="#D6A97A" stroke-width="3"/><circle cx="397" cy="675" r="28" fill="#FFE8D6" stroke="#D6A97A" stroke-width="2"/><line x1="397" y1="675" x2="397.0" y2="567.0" stroke="#E5C4A5" stroke-width="2"/><text font-family="DejaVu Sans,sans-serif" font-size="11" fill="#6F5B52"><tspan x="397" y="599" text-anchor="middle">A person who</tspan><tspan x="397" y="612" text-anchor="middle">helped me</tspan></text><line x1="397" y1="675" x2="490.5" y2="621.0" stroke="#E5C4A5" stroke-width="2"/><text font-family="DejaVu Sans,sans-serif" font-size="11" fill="#6F5B52"><tspan x="455.88972745734185" y="633" text-anchor="middle">Something my</tspan><tspan x="455.88972745734185" y="646" text-anchor="middle">body can do</tspan></text><line x1="397" y1="675" x2="490.5" y2="729.0" stroke="#E5C4A5" stroke-width="2"/><text font-family="DejaVu Sans,sans-serif" font-size="11" fill="#6F5B52"><tspan x="455.88972745734185" y="701" text-anchor="middle">A place that</tspan><tspan x="455.88972745734185" y="714" text-anchor="middle">makes me feel</tspan><tspan x="455.88972745734185" y="727" text-anchor="middle">safe</tspan></text><line x1="397" y1="675" x2="397.0" y2="783.0" stroke="#E5C4A5" stroke-width="2"/><text font-family="DejaVu Sans,sans-serif" font-size="11" fill="#6F5B52"><tspan x="397" y="735" text-anchor="middle">A lesson from</tspan><tspan x="397" y="748" text-anchor="middle">today</tspan></text><line x1="397" y1="675" x2="303.5" y2="729.0" stroke="#E5C4A5" stroke-width="2"/><text font-family="DejaVu Sans,sans-serif" font-size="11" fill="#6F5B52"><tspan x="338.11027254265815" y="701" text-anchor="middle">A small joy I</tspan><tspan x="338.11027254265815" y="714" text-anchor="middle">noticed</tspan></text><line x1="397" y1="675" x2="303.5" y2="621.0" stroke="#E5C4A5" stroke-width="2"/><text font-family="DejaVu Sans,sans-serif" font-size="11" fill="#6F5B52"><tspan x="338.11027254265815" y="633" text-anchor="middle">A way I can</tspan><tspan x="338.11027254265815" y="646" text-anchor="middle">give thanks</tspan></text><line x1="289" y1="675" x2="505" y2="675" stroke="#D16A5C" stroke-width="2.5" stroke-dasharray="10 6"/><polygon points="615,622 660,640 615,658" fill="#E8F2E4" stroke="#9DB38F" stroke-width="2"/><line x1="615" y1="640" x2="660" y2="640" stroke="#D16A5C" stroke-width="2.5" stroke-dasharray="10 6"/><text font-family="DejaVu Sans,sans-serif" font-size="14" fill="#6F5B52"><tspan x="600" y="730" text-anchor="middle">Cut the arrow and</tspan><tspan x="600" y="748" text-anchor="middle">attach it at the</tspan><tspan x="600" y="766" text-anchor="middle">centre.</tspan></text></g></g>

<rect x="55" y="875" width="684" height="170" rx="24" class="panel-green"/>
<text x="397" y="910" text-anchor="middle" class="title" font-size="16">WHY THIS CRAFT MATTERS</text>
<text id="WISDOM" x="397" y="946" text-anchor="middle" class="body" font-size="17"><tspan x="397" y="946">Like a lotus, gratitude can grow even when life feels muddy.</tspan></text>
<text id="TAKE_IT_TODAY" x="397" y="998" text-anchor="middle" class="small" font-size="14"><tspan x="397" y="998">Spin once tonight and thank one person, place, or gift from your day.</tspan></text>
</svg>
