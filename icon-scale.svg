<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100" viewBox="0 0 100 100">

  <!-- 100x100 canvas, icon 80x80 centered -->
  <rect width="100" height="100" fill="#F5F0EA"/>

  <!-- Balance Scale icon centered at (50,50) within 80x80 -->
  <g id="scale">

    <!-- Vertical pillar -->
    <rect x="47" y="28" width="6" height="50" rx="1.5" fill="#E3B24C"/>

    <!-- Base platform -->
    <rect x="35" y="75" width="30" height="5" rx="2.5" fill="#E3B24C"/>

    <!-- Top pivot circle -->
    <circle cx="50" cy="28" r="3.5" fill="#E3B24C"/>

    <!-- Horizontal beam -->
    <rect x="18" y="26" width="64" height="4.5" rx="1.5" fill="#E3B24C"/>

    <!-- Left chain -->
    <line x1="24" y1="30.5" x2="24" y2="50" stroke="#E3B24C" stroke-width="1.5"/>

    <!-- Right chain -->
    <line x1="76" y1="30.5" x2="76" y2="50" stroke="#E3B24C" stroke-width="1.5"/>

    <!-- Left circle (green) - solid, no shading -->
    <circle cx="24" cy="58" r="10" fill="#8EBB9A"/>

    <!-- Right circle (teal) - solid, no shading -->
    <circle cx="76" cy="58" r="10" fill="#8EC6C8"/>

  </g>

</svg>
