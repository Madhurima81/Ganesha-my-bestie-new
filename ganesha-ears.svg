<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="512" height="512" viewBox="0 0 512 512">

  <!-- ═══════════════ LEFT EAR ═══════════════ -->
  <g inkscape:groupmode="layer" inkscape:label="Left Ear" id="layer-left-ear">

    <!-- Outer shape — organic fan: wide top-left, concave inner edge, soft bottom bulge -->
    <path d="M 190,100
             C 140,80 70,95 38,155
             C 10,210 10,290 35,350
             C 55,395 95,420 140,415
             C 175,412 205,390 218,355
             C 235,310 230,255 222,205
             C 215,155 205,115 190,100 Z"
          fill="#C9BFB5"/>

    <!-- Subtle depth — bottom 20%, #B5A99D, 27% opacity -->
    <path d="M 35,350
             C 55,395 95,420 140,415
             C 175,412 205,390 218,355
             C 200,385 165,405 135,408
             C 95,412 60,390 35,350 Z"
          fill="#B5A99D" opacity="0.27"/>

    <!-- Inner soft tone — muted pink, 75% opacity, slightly smaller + inset -->
    <path d="M 178,135
             C 138,118 82,132 58,180
             C 34,228 35,300 55,348
             C 72,385 105,400 140,395
             C 165,392 188,374 198,345
             C 212,305 210,252 204,208
             C 198,170 190,145 178,135 Z"
          fill="#D8A8A8" opacity="0.75"/>

  </g>

  <!-- ═══════════════ RIGHT EAR (mirrored) ═══════════════ -->
  <g inkscape:groupmode="layer" inkscape:label="Right Ear" id="layer-right-ear">

    <!-- Outer shape — mirror of left: wide top-right -->
    <path d="M 322,100
             C 372,80 442,95 474,155
             C 502,210 502,290 477,350
             C 457,395 417,420 372,415
             C 337,412 307,390 294,355
             C 277,310 282,255 290,205
             C 297,155 307,115 322,100 Z"
          fill="#C9BFB5"/>

    <!-- Subtle depth — bottom 20% -->
    <path d="M 477,350
             C 457,395 417,420 372,415
             C 337,412 307,390 294,355
             C 312,385 347,405 377,408
             C 417,412 452,390 477,350 Z"
          fill="#B5A99D" opacity="0.27"/>

    <!-- Inner soft tone — muted pink, 75% opacity -->
    <path d="M 334,135
             C 374,118 430,132 454,180
             C 478,228 477,300 457,348
             C 440,385 407,400 372,395
             C 347,392 324,374 314,345
             C 300,305 302,252 308,208
             C 314,170 322,145 334,135 Z"
          fill="#D8A8A8" opacity="0.75"/>

  </g>

</svg>
