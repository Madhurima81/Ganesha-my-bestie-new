<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="512" height="512" viewBox="0 0 512 512">

  <!-- ═══════════════ LEFT EAR ═══════════════ -->
  <g inkscape:groupmode="layer" inkscape:label="Left Ear" id="layer-left-ear">

    <!-- Outer shape — warm beige-grey, no stroke -->
    <path d="M 195,120
             C 155,105 95,120 65,185
             C 35,250 40,335 75,380
             C 105,415 155,410 190,370
             C 220,335 235,280 230,220
             C 225,165 210,130 195,120 Z"
          fill="#C9BFB5"/>

    <!-- Subtle depth — bottom 20%, #B5A99D, 27% opacity -->
    <path d="M 75,380
             C 105,415 155,410 190,370
             C 200,358 210,340 218,320
             C 195,355 165,395 130,400
             C 100,405 82,395 75,380 Z"
          fill="#B5A99D" opacity="0.27"/>

    <!-- Inner soft tone — muted pink, 75% opacity -->
    <path d="M 185,155
             C 155,142 110,155 87,205
             C 64,255 68,325 95,360
             C 118,388 152,383 175,350
             C 198,317 208,270 205,220
             C 202,180 195,162 185,155 Z"
          fill="#D8A8A8" opacity="0.75"/>

  </g>

  <!-- ═══════════════ RIGHT EAR (mirrored) ═══════════════ -->
  <g inkscape:groupmode="layer" inkscape:label="Right Ear" id="layer-right-ear">

    <!-- Outer shape — warm beige-grey, no stroke -->
    <path d="M 317,120
             C 357,105 417,120 447,185
             C 477,250 472,335 437,380
             C 407,415 357,410 322,370
             C 292,335 277,280 282,220
             C 287,165 302,130 317,120 Z"
          fill="#C9BFB5"/>

    <!-- Subtle depth — bottom 20%, #B5A99D, 27% opacity -->
    <path d="M 437,380
             C 407,415 357,410 322,370
             C 312,358 302,340 294,320
             C 317,355 347,395 382,400
             C 412,405 430,395 437,380 Z"
          fill="#B5A99D" opacity="0.27"/>

    <!-- Inner soft tone — muted pink, 75% opacity -->
    <path d="M 327,155
             C 357,142 402,155 425,205
             C 448,255 444,325 417,360
             C 394,388 360,383 337,350
             C 314,317 304,270 307,220
             C 310,180 317,162 327,155 Z"
          fill="#D8A8A8" opacity="0.75"/>

  </g>

</svg>
