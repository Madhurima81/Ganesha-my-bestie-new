<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Me Hut QA Checklist Tool</title>
  <style>
    :root {
      --bg: #f7efe4;
      --panel: #fffaf3;
      --panel-strong: #fff;
      --ink: #2f241c;
      --muted: #7a685b;
      --line: #e3d5c3;
      --accent: #c96f3b;
      --accent-2: #f2b977;
      --done: #2f8f5b;
      --not-done: #c44949;
      --skip: #9a7b58;
      --shadow: 0 12px 32px rgba(101, 63, 28, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(242, 185, 119, 0.38), transparent 28%),
        radial-gradient(circle at top right, rgba(201, 111, 59, 0.22), transparent 26%),
        linear-gradient(180deg, #fbf5ea 0%, var(--bg) 100%);
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero,
    .toolbar,
    .section-card,
    .item-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.04;
    }

    .subtext {
      margin: 14px 0 0;
      max-width: 760px;
      font-size: 17px;
      line-height: 1.5;
      color: var(--muted);
    }

    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr auto;
      gap: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-button {
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow);
    }

    .tab-button.active {
      background: linear-gradient(180deg, #fff3e2 0%, #f4d5b0 100%);
      border-color: var(--accent-2);
    }

    .field,
    button,
    select {
      border-radius: 14px;
      border: 1px solid var(--line);
      font: inherit;
    }

    .field,
    select {
      width: 100%;
      padding: 12px 14px;
      background: var(--panel-strong);
      color: var(--ink);
    }

    button {
      padding: 11px 14px;
      background: linear-gradient(180deg, #fff 0%, #f6eadb 100%);
      color: var(--ink);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent-2);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }

    .summary-card strong {
      display: block;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .sections {
      display: grid;
      gap: 18px;
    }

    .section-card {
      padding: 20px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 28px;
    }

    .group {
      margin-top: 18px;
    }

    .group h3 {
      margin: 0 0 12px;
      font-size: 18px;
      color: var(--accent);
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .item-card {
      padding: 14px;
      background: rgba(255, 255, 255, 0.82);
    }

    .item-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .item-text {
      margin: 0;
      font-size: 16px;
      line-height: 1.45;
    }

    .item-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .choice-row label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      cursor: pointer;
    }

    .choice-row label[data-status="done"].active {
      border-color: rgba(47, 143, 91, 0.45);
      background: rgba(47, 143, 91, 0.14);
    }

    .choice-row label[data-status="not-done"].active {
      border-color: rgba(196, 73, 73, 0.45);
      background: rgba(196, 73, 73, 0.14);
    }

    .choice-row label[data-status="skip"].active {
      border-color: rgba(154, 123, 88, 0.45);
      background: rgba(154, 123, 88, 0.14);
    }

    textarea {
      width: 100%;
      min-height: 76px;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      resize: vertical;
    }

    .hidden {
      display: none !important;
    }

    .helper {
      color: var(--muted);
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 960px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 14px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .item-top {
        grid-template-columns: 1fr;
      }

      .item-controls {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <p class="eyebrow">QA Review Helper</p>
      <h1>About Me Hut Checklist</h1>
      <p class="subtext">
        Read each check aloud, mark it as done or not done, and leave notes as you go.
        Everything saves in your browser automatically, so you can stop and continue later.
      </p>
    </section>

    <section class="tabs">
      <button id="journeyTab" class="tab-button active" type="button">Full QA Flow</button>
      <button id="smokeTab" class="tab-button" type="button">13 Scene Smoke Test</button>
    </section>

    <section class="toolbar">
      <input id="searchInput" class="field" type="search" placeholder="Search a check, phase, or scene" />
      <select id="sectionFilter" aria-label="Filter by section"></select>
      <select id="statusFilter" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option value="todo">Not reviewed yet</option>
        <option value="done">Done</option>
        <option value="not-done">Not done</option>
        <option value="skip">Skip</option>
        <option value="commented">Has comments</option>
      </select>
      <button id="clearAllButton" type="button">Reset saved answers</button>
    </section>

    <section class="summary" id="summary"></section>
    <section class="sections" id="sections"></section>
  </div>

  <script>
    const DATASET_CONFIG = {
      journey: {
        storageKey: "about-me-hut-qa-checklist-tool-v2",
        title: "About Me Hut Checklist",
        subtitle: "Read each check aloud, mark it as done or not done, and leave notes as you go. Everything saves in your browser automatically, so you can stop and continue later.",
        markdown: buildJourneyMarkdown(),
        legacyStorageKeys: [
          "about-me-hut-qa-checklist-tool-v1",
          "about-me-hut-qa-checklist-tool-v2"
        ]
      },
      smoke: {
        storageKey: "gmb-smoke-test-13-scenes-v1",
        title: "GMB 13 Scene Smoke Test",
        subtitle: "Quick pass-fail sweep for the 13 active scenes. Use this as a separate tab so smoke testing stays lightweight and fast.",
        markdown: buildSmokeMarkdown(),
        legacyStorageKeys: []
      }
    };

    let activeDatasetKey = "journey";
    let activeConfig = DATASET_CONFIG[activeDatasetKey];
    let state = loadState(activeConfig);
    let data = parseChecklist(activeConfig.markdown);
    let allItems = flattenItems(data);

    function buildJourneyMarkdown() {
      return String.raw`# Fresh Run QA Checklist - July 2026

Use this checklist in real play order: app launch -> startup gates -> profile flow -> map -> zone checks -> bug-fix regressions.

## 1. App Launch + Loading

### Cold Start
- [ ] Launch the app from a fully closed state on a fresh profile/device.
- [ ] Confirm the loading screen appears cleanly with no broken layout, blank flash, or stuck spinner.
- [ ] Confirm loading completes into the main welcome flow instead of hanging on the loading screen.
- [ ] Confirm no console errors appear during initial app startup.

### Audio Unlock Readiness
- [ ] Confirm startup does not auto-play overlapping voice or SFX before the first user gesture.
- [ ] Confirm audio can still be unlocked normally once the user interacts.

## 2. Main Screen + Tap Gate

### Main Welcome
- [ ] Confirm the main welcome screen appears correctly after loading.
- [ ] Tap the main CTA to continue.
- [ ] Confirm the flow advances cleanly into the next startup gate/screen.

### Tap Gate
- [ ] On the tap-to-continue gate, tap once.
- [ ] Confirm the gate unlocks on the first tap and does not require repeated taps.
- [ ] Try tapping rapidly after unlock.
- [ ] Confirm the gate does not double-fire or create duplicated audio/speech behavior.

## 3. Parent Gate

### Math Step
- [ ] Reach the parent gate before profile creation.
- [ ] Enter a wrong answer once.
- [ ] Confirm the gate stays stable and shows the retry feedback.
- [ ] Enter wrong answers until the limit is hit.
- [ ] Confirm the flow returns safely instead of breaking or trapping the user.
- [ ] Re-enter and submit the correct answer.
- [ ] Confirm the consent step opens normally.

### Consent Step
- [ ] Confirm Continue stays disabled until the consent checkbox is checked.
- [ ] Open the Privacy Policy and return.
- [ ] Confirm the consent screen restores correctly after returning.
- [ ] Continue with the checkbox enabled.
- [ ] Confirm parent consent is accepted and the app proceeds into profile creation/onboarding.

## 4. Create Profile + Intro Story

### Profile Chooser Screen
- [ ] Reach the Who's Playing? screen after the parent gate.
- [ ] Confirm the screen shows four profile slots in a 2x2 grid.
- [ ] Confirm each empty slot shows the Add Friend label and plus button clearly.
- [ ] Confirm the background artwork, title, and layout appear cleanly with no overlap, crop, or missing assets.
- [ ] Tap the help ? button.
- [ ] Confirm the help flow opens correctly and closes cleanly back to the same profile chooser screen.
- [ ] Tap the top-right action button.
- [ ] Confirm it behaves correctly for this screen and does not navigate to a broken or blank state.

### Profile Creation Step By Step
- [ ] Tap one empty Add Friend slot.
- [ ] Confirm the create-profile flow opens immediately from that selected slot.
- [ ] Enter the child's name.
- [ ] Confirm the typed name appears correctly with no input glitch or blocked keyboard behavior.
- [ ] Continue to the next creation step.
- [ ] Select the child's avatar / profile visual if that step appears in your build.
- [ ] Confirm the selected option stays highlighted correctly when chosen.
- [ ] Continue to the next step.
- [ ] Select age or any remaining required setup fields if shown in your build.
- [ ] Confirm Continue / Create only enables when required inputs are complete.
- [ ] Finish profile creation.
- [ ] Confirm the new child profile is created successfully and becomes the active profile.
- [ ] Confirm the created profile appears in the previously empty slot on the Who's Playing? screen with the correct saved details.
- [ ] Re-open the newly created profile from the chooser.
- [ ] Confirm the app moves into the Ganesha intro story instead of skipping unexpectedly or stalling.

### Profile Screen Regression Checks
- [ ] Return to the Who's Playing? screen after creating one profile.
- [ ] Confirm the remaining empty slots still show Add Friend correctly.
- [ ] Confirm the created slot is still tappable and loads the correct child.
- [ ] Create a second profile if needed for smoke testing.
- [ ] Confirm selecting one profile does not overwrite or switch details from another slot.
- [ ] Confirm no console errors appear while opening, creating, selecting, or returning from the profile chooser screen.

### GaneshaIntroStory - Double-Tap Loop
- [ ] On slide 1, tap once, then immediately tap again before the 2.8s window elapses.
- [ ] Confirm the second tap is ignored: no VO restart, no timer reset, no loop.
- [ ] Confirm the story advances to slide 2 exactly once.

### GaneshaIntroStory - VO Timing
- [ ] With audio on, tap Tap to begin.
- [ ] Confirm the opening VO line plays to completion before slide advance.
- [ ] With audio explicitly disabled, repeat the step.
- [ ] Confirm the first slide advances faster and does not wait the full spoken timing.

### GaneshaIntroStory - Skip + Regression
- [ ] Start VO on any slide, then tap Skip mid-sentence.
- [ ] Confirm speech stops immediately when the story closes.
- [ ] Run through all slides normally once.
- [ ] Confirm each slide VO plays once, the end screen appears, and completion exits correctly.
- [ ] Confirm no speechSynthesis console errors appear during slide changes, Skip, or close.

## 5. First Map Arrival

### Fresh Map Load
- [ ] After onboarding, arrive on the map for the first time.
- [ ] Confirm the map loads cleanly with no blank state or broken zone art.
- [ ] Confirm this first-time map state is treated as a brand-new journey, with Symbol Mountain as the starting zone.
- [ ] Confirm Symbol Mountain is visibly active/unlocked on first arrival.
- [ ] Confirm Shloka River and Mooshika's Hut remain locked on first arrival.
- [ ] Confirm gmb_map_props / gmb_map_overlays / gmb_map_zone_art are NOT written just from fresh mounting on a brand-new profile.
- [ ] Confirm the map ambient audio loads the .mp3 file, not .wav.
- [ ] Confirm no [VO]-prefixed console logs appear during normal map idle/tap behavior.

### First-Time Map VO + Prompting
- [ ] On first arrival, wait for the opening map VO.
- [ ] Confirm the first spoken line invites the child to start at Symbol Mountain.
- [ ] Confirm that first-load intro VO plays once for the session and does not keep replaying on the same arrival.
- [ ] Do not tap anything for about 7 seconds.
- [ ] Confirm the idle nudge plays, telling the child to tap Symbol Mountain when ready.
- [ ] Confirm the idle nudge does not stack repeatedly or overlap itself immediately.

### Profile + Navigation Basics
- [ ] Confirm the active profile name/avatar display correctly on the map.
- [ ] Confirm the profile chip is visible and stable on the map screen.
- [ ] Tap around the map and confirm zone interaction feels normal with no dead taps.
- [ ] Tap a locked zone on first arrival.
- [ ] Confirm locked-zone behavior is friendly and non-breaking, with no accidental navigation into a locked zone.
- [ ] Confirm no new console errors appear during first map load and first zone entry.

## 6. Symbol Mountain First Run -> Modak

### Entry + Unlock Path
- [ ] From the fresh profile map, enter Symbol Mountain through the normal first-run path.
- [ ] Confirm the very first Symbol Mountain tap takes the user straight into Modak, not into a zone welcome screen.
- [ ] Confirm the route into the first playable scene is correct.
- [ ] Complete exactly 1 Symbol Mountain scene.
- [ ] Return to the map and confirm Shloka River is unlocked and its progress dots are visible immediately.
- [ ] Confirm the map no longer looks like the untouched first-load state after returning from scene 1.

### Return To Map After Scene 1
- [ ] After completing scene 1 and returning, confirm Symbol Mountain now shows 1 completed progress dot.
- [ ] Confirm Shloka River is newly unlocked after exactly 1 completed Symbol Mountain scene.
- [ ] Confirm Shloka River progress dots are now visible immediately on the map.
- [ ] Confirm the unlock animation/chime runs for Shloka River without freezing the map.
- [ ] Confirm the Shloka River unlock VO plays after the unlock moment.
- [ ] Confirm returning to the map after scene 1 does not replay the original first-time Symbol Mountain intro VO.
- [ ] Tap Shloka River after it unlocks.
- [ ] Confirm it now opens normally instead of behaving like a locked zone.

### Modak Completion Alignment
- [ ] Complete Modak fully through the actual completion screen, not just rock_transformed.
- [ ] Return to the map.
- [ ] Confirm the Modak dot fills and Shloka River unlock state is correct.
- [ ] Reopen the Modak card from the map state after completion.
- [ ] Confirm it shows Play Again, not Continue.
- [ ] Leave Modak mid-way at the rock_transformed stage on another run and return to the map.
- [ ] Confirm the map does NOT mark it complete or unlock River early.

### NewModakSceneV7 Checks
- [ ] Reach game 3 and feed one modak normally.
- [ ] Confirm the basket loses 1 modak, belly grows once, and feed count advances once.
- [ ] Feed the second modak at a normal pace.
- [ ] Confirm the basket loses 1 more modak, belly grows again, and no progress is missed.
- [ ] Try two very fast back-to-back drops.
- [ ] Confirm only one is accepted if they land too close together, with no desync.
- [ ] Wait about half a second, then drop again.
- [ ] Confirm feeding works again after the short lock window.
- [ ] After feeding modak 1 and modak 2, stop and wait for idle hints.
- [ ] Confirm the visual hints restart and the feed voice hint can play again each time.
- [ ] Feed all 3 modaks.
- [ ] Confirm dragging stops, extra drops are blocked, and transformation still starts correctly.
- [ ] Reload during game 3 before finishing.
- [ ] Confirm game 3 restores, instruction voice replays, idle restarts, and the original drag gesture does not wrongly reappear.
- [ ] Pause during game 3, then resume.
- [ ] Confirm feeding still works and no stuck drag/feed state appears.
- [ ] Try dropping after rockFeedCount is 3.
- [ ] Confirm no more feeding happens after completion threshold.

## 7. Shloka River Entry + ZoneWelcome

### ZoneWelcome State
- [ ] Enter Shloka River after unlocking it from the fresh run.
- [ ] Confirm the zone welcome screen opens correctly.
- [ ] Confirm scene statuses and progress dots match the actual map progress.
- [ ] Confirm zone names with embedded newlines are spoken naturally with spaces, not broken line-by-line.

### ZoneWelcome Confetti + Logging
- [ ] Complete the final scene in a zone and confirm confetti plays once and fully clears from the DOM.
- [ ] Re-enter the same completed zone on the same profile.
- [ ] Confirm confetti does NOT replay.
- [ ] In production, confirm ZoneWelcome does not spam scene-status console logs.
- [ ] In dev, confirm useful debug logging is still gated rather than globally removed.

## 8. About Me Hut - FamilyTreeGame

### Core Flow
- [ ] Place all 4 Ganesha family members.
- [ ] Wait 5 seconds after the 4th placement.
- [ ] Confirm sparkles appear.
- [ ] Confirm sparkles turn off after about 2.5 seconds.

- [ ] Reach Origin Card and make selections.

## 13. Symbol Mountain Extended Checks

### Pond
- [ ] Drag the water drop, background the app/tab, return after countdown, then move your finger without pressing.

    const sectionsEl = document.getElementById("sections");
    const sectionFilterEl = document.getElementById("sectionFilter");
    const statusFilterEl = document.getElementById("statusFilter");
    const searchInputEl = document.getElementById("searchInput");
    const summaryEl = document.getElementById("summary");
    const clearAllButtonEl = document.getElementById("clearAllButton");
    const journeyTabEl = document.getElementById("journeyTab");
    const smokeTabEl = document.getElementById("smokeTab");
    const heroTitleEl = document.querySelector(".hero h1");
    const heroSubtitleEl = document.querySelector(".hero .subtext");

    journeyTabEl.addEventListener("click", () => switchDataset("journey"));
    smokeTabEl.addEventListener("click", () => switchDataset("smoke"));
    populateSectionFilter();
    render();

    searchInputEl.addEventListener("input", render);
    sectionFilterEl.addEventListener("change", render);
    statusFilterEl.addEventListener("change", render);
    clearAllButtonEl.addEventListener("click", () => {
      const ok = window.confirm("Clear all saved checklist statuses and comments for this page?");
      if (!ok) return;
      localStorage.removeItem(activeConfig.storageKey);
      state.items = {};
      render();
    });

    function switchDataset(datasetKey) {
      if (datasetKey === activeDatasetKey) return;
      activeDatasetKey = datasetKey;
      activeConfig = DATASET_CONFIG[datasetKey];
      state = loadState(activeConfig);
      data = parseChecklist(activeConfig.markdown);
      allItems = flattenItems(data);
      heroTitleEl.textContent = activeConfig.title;
      heroSubtitleEl.textContent = activeConfig.subtitle;
      journeyTabEl.classList.toggle("active", datasetKey === "journey");
      smokeTabEl.classList.toggle("active", datasetKey === "smoke");
      searchInputEl.value = "";
      statusFilterEl.value = "all";
      populateSectionFilter();
      render();
    }

    function flattenItems(parsedData) {
      return parsedData.sections.flatMap((section) =>
        section.groups.flatMap((group) => group.items.map((item) => ({ ...item, sectionTitle: section.title, groupTitle: group.title })))
      );
    }

    function populateSectionFilter() {
      const options = ['<option value="all">All sections</option>']
        .concat(data.sections.map((section) => `<option value="${escapeHtml(section.title)}">${escapeHtml(section.title)}</option>`));
      sectionFilterEl.innerHTML = options.join("");
    }

    function render() {
      const query = searchInputEl.value.trim().toLowerCase();
      const sectionFilter = sectionFilterEl.value;
      const statusFilter = statusFilterEl.value;

      const filteredSections = data.sections
        .map((section) => ({
          ...section,
          groups: section.groups
            .map((group) => ({
              ...group,
              items: group.items.filter((item) => matchesFilters(item, section.title, group.title, query, sectionFilter, statusFilter))
            }))
            .filter((group) => group.items.length > 0)
        }))
        .filter((section) => section.groups.length > 0);

      renderSummary();
      sectionsEl.innerHTML = filteredSections.map(renderSection).join("");
      bindInteractiveControls();
    }

    function renderSummary() {
      const total = allItems.length;
      const done = allItems.filter((item) => getItemState(item.id).status === "done").length;
      const notDone = allItems.filter((item) => getItemState(item.id).status === "not-done").length;
      const commented = allItems.filter((item) => (getItemState(item.id).comment || "").trim()).length;

      summaryEl.innerHTML = `
        <div class="summary-card"><strong>${total}</strong><span>Total checks</span></div>
        <div class="summary-card"><strong>${done}</strong><span>Marked done</span></div>
        <div class="summary-card"><strong>${notDone}</strong><span>Marked not done</span></div>
        <div class="summary-card"><strong>${commented}</strong><span>With notes</span></div>
      `;
    }

    function renderSection(section) {
      const sectionItems = section.groups.flatMap((group) => group.items);
      const done = sectionItems.filter((item) => getItemState(item.id).status === "done").length;
      return `
        <article class="section-card">
          <div class="section-head">
            <div>
              <h2 class="section-title">${escapeHtml(section.title)}</h2>
              <div class="helper">${done} of ${sectionItems.length} marked done</div>
            </div>
            <button type="button" data-speak="${escapeAttribute(section.title)}">Read section title</button>
          </div>
          ${section.groups.map(renderGroup).join("")}
        </article>
      `;
    }

    function renderGroup(group) {
      return `
        <section class="group">
          <h3>${escapeHtml(group.title)}</h3>
          <div class="items">
            ${group.items.map(renderItem).join("")}
          </div>
        </section>
      `;
    }

    function renderItem(item) {
      const itemState = getItemState(item.id);
      return `
        <article class="item-card">
          <div class="item-top">
            <p class="item-text">${escapeHtml(item.text)}</p>
            <div class="item-controls">
              <button type="button" data-speak="${escapeAttribute(item.text)}">Read aloud</button>
            </div>
          </div>
          <div class="choice-row" data-choice-row="${item.id}">
            ${renderChoice(item.id, "done", "Done", itemState.status)}
            ${renderChoice(item.id, "not-done", "Not done", itemState.status)}
            ${renderChoice(item.id, "skip", "Skip", itemState.status)}
          </div>
          <textarea data-comment="${item.id}" placeholder="Add comments, bug notes, device info, or follow-up...">${escapeHtml(itemState.comment || "")}</textarea>
        </article>
      `;
    }

    function renderChoice(itemId, value, label, current) {
      const checked = current === value ? "checked" : "";
      const active = current === value ? "active" : "";
      return `
        <label data-status="${value}" class="${active}">
          <input type="radio" name="status-${itemId}" value="${value}" data-status-input="${itemId}" ${checked} />
          <span>${label}</span>
        </label>
      `;
    }

    function bindInteractiveControls() {
      document.querySelectorAll("[data-speak]").forEach((button) => {
        button.addEventListener("click", () => speak(button.getAttribute("data-speak")));
      });

      document.querySelectorAll("[data-status-input]").forEach((input) => {
        input.addEventListener("change", () => {
          const itemId = input.getAttribute("data-status-input");
          updateItemState(itemId, { status: input.value });
          updateChoiceRow(itemId);
          renderSummary();
        });
      });

      document.querySelectorAll("[data-comment]").forEach((textarea) => {
        textarea.addEventListener("input", () => {
          updateItemState(textarea.getAttribute("data-comment"), { comment: textarea.value });
          renderSummary();
        });
      });
    }

    function updateChoiceRow(itemId) {
      const row = document.querySelector(`[data-choice-row="${CSS.escape(itemId)}"]`);
      if (!row) return;
      const itemState = getItemState(itemId);
      row.querySelectorAll("label").forEach((label) => {
        label.classList.toggle("active", label.getAttribute("data-status") === itemState.status);
      });
    }

    function matchesFilters(item, sectionTitle, groupTitle, query, sectionFilter, statusFilter) {
      const itemState = getItemState(item.id);
      const textBlob = [sectionTitle, groupTitle, item.text, itemState.comment || ""].join(" ").toLowerCase();
      const matchesQuery = !query || textBlob.includes(query);
      const matchesSection = sectionFilter === "all" || sectionTitle === sectionFilter;
      const matchesStatus =
        statusFilter === "all" ||
        (statusFilter === "todo" && !itemState.status) ||
        (statusFilter === "commented" && !!(itemState.comment || "").trim()) ||
        itemState.status === statusFilter;

      return matchesQuery && matchesSection && matchesStatus;
    }

    function speak(text) {
      if (!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance === "undefined") {
        window.alert("This browser does not support read aloud.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function parseChecklist(md) {
      const lines = md.split(/\r?\n/);
      const sections = [];
      let currentSection = null;
      let currentGroup = null;
      let itemIndex = 0;

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        if (line.startsWith("## ")) {
          currentSection = { title: line.replace(/^##\s+/, ""), groups: [] };
          sections.push(currentSection);
          currentGroup = null;
          continue;
        }
        if (line.startsWith("### ")) {
          if (!currentSection) continue;
          currentGroup = { title: line.replace(/^###\s+/, ""), items: [] };
          currentSection.groups.push(currentGroup);
          continue;
        }
        if (line.startsWith("- [ ] ")) {
          if (!currentSection) continue;
          if (!currentGroup) {
            currentGroup = { title: "Checklist", items: [] };
            currentSection.groups.push(currentGroup);
          }
          const text = line.replace(/^- \[ \]\s+/, "");
          const id = `item-${++itemIndex}`;
          currentGroup.items.push({ id, text });
        }
      }

      return { sections };
    }

    function loadState(config) {
      try {
        const currentRaw = localStorage.getItem(config.storageKey);
        if (currentRaw) {
          return JSON.parse(currentRaw);
        }

        for (const key of config.legacyStorageKeys) {
          if (key === config.storageKey) continue;
          const legacyRaw = localStorage.getItem(key);
          if (!legacyRaw) continue;
          const parsed = JSON.parse(legacyRaw);
          localStorage.setItem(config.storageKey, JSON.stringify(parsed));
          return parsed;
        }

        return { items: {} };
      } catch (error) {
        return { items: {} };
      }
    }

    function saveState() {
      localStorage.setItem(activeConfig.storageKey, JSON.stringify(state));
    }

    function getItemState(itemId) {
      if (!state.items[itemId]) state.items[itemId] = { status: "", comment: "" };
      return state.items[itemId];
    }

    function updateItemState(itemId, patch) {
      state.items[itemId] = { ...getItemState(itemId), ...patch };
      saveState();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }
  </script>
