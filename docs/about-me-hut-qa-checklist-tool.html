      max-width: 760px;
      font-size: 17px;
      line-height: 1.5;
      color: var(--muted);
    }

    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr auto;
      gap: 12px;
      padding: 16px;
      margin-bottom: 20px;

    .field,
    button,
    select {
      border-radius: 14px;
      border: 1px solid var(--line);
      font: inherit;
    }

    .field,
    select {
      width: 100%;
      padding: 12px 14px;
      background: var(--panel-strong);
      color: var(--ink);
    }

      padding: 12px 14px;
      border: 1px solid var(--line);

</head>

    const STORAGE_KEY = "about-me-hut-qa-checklist-tool-v1";
    const state = loadState();
    const data = parseChecklist(markdown);
    const allItems = data.sections.flatMap((section) =>
      section.groups.flatMap((group) => group.items.map((item) => ({ ...item, sectionTitle: section.title, groupTitle: group.title })))
    );

    const sectionsEl = document.getElementById("sections");
    const sectionFilterEl = document.getElementById("sectionFilter");
    const statusFilterEl = document.getElementById("statusFilter");
    const searchInputEl = document.getElementById("searchInput");
    const summaryEl = document.getElementById("summary");
    const clearAllButtonEl = document.getElementById("clearAllButton");

    populateSectionFilter();
    render();

    searchInputEl.addEventListener("input", render);
    sectionFilterEl.addEventListener("change", render);
    statusFilterEl.addEventListener("change", render);
    clearAllButtonEl.addEventListener("click", () => {
      const ok = window.confirm("Clear all saved checklist statuses and comments for this page?");
      if (!ok) return;
      localStorage.removeItem(STORAGE_KEY);
      state.items = {};
      render();
    });

    function populateSectionFilter() {
      const options = ['<option value="all">All sections</option>']
        .concat(data.sections.map((section) => `<option value="${escapeHtml(section.title)}">${escapeHtml(section.title)}</option>`));
      sectionFilterEl.innerHTML = options.join("");
    }

    function render() {
      const query = searchInputEl.value.trim().toLowerCase();
      const sectionFilter = sectionFilterEl.value;
      const statusFilter = statusFilterEl.value;

      const filteredSections = data.sections
        .map((section) => ({
          ...section,
          groups: section.groups
            .map((group) => ({
              ...group,
              items: group.items.filter((item) => matchesFilters(item, section.title, group.title, query, sectionFilter, statusFilter))
            }))
            .filter((group) => group.items.length > 0)
        }))
        .filter((section) => section.groups.length > 0);

      renderSummary();
      sectionsEl.innerHTML = filteredSections.map(renderSection).join("");
      bindInteractiveControls();
    }

    function renderSummary() {
      const total = allItems.length;
      const done = allItems.filter((item) => getItemState(item.id).status === "done").length;
      const notDone = allItems.filter((item) => getItemState(item.id).status === "not-done").length;
      const commented = allItems.filter((item) => (getItemState(item.id).comment || "").trim()).length;

      summaryEl.innerHTML = `
        <div class="summary-card"><strong>${total}</strong><span>Total checks</span></div>
        <div class="summary-card"><strong>${done}</strong><span>Marked done</span></div>
        <div class="summary-card"><strong>${notDone}</strong><span>Marked not done</span></div>
        <div class="summary-card"><strong>${commented}</strong><span>With notes</span></div>
      `;
    }

    function renderSection(section) {
      const sectionItems = section.groups.flatMap((group) => group.items);
      const done = sectionItems.filter((item) => getItemState(item.id).status === "done").length;
      return `
        <article class="section-card">
          <div class="section-head">
            <div>
              <h2 class="section-title">${escapeHtml(section.title)}</h2>
              <div class="helper">${done} of ${sectionItems.length} marked done</div>
            </div>
            <button type="button" data-speak="${escapeAttribute(section.title)}">Read section title</button>
          </div>
          ${section.groups.map(renderGroup).join("")}
        </article>
      `;
    }

    function renderGroup(group) {
      return `
        <section class="group">
          <h3>${escapeHtml(group.title)}</h3>
          <div class="items">
            ${group.items.map(renderItem).join("")}
          </div>
        </section>
      `;
    }

    function renderItem(item) {
      const itemState = getItemState(item.id);
      return `
        <article class="item-card">
          <div class="item-top">
            <p class="item-text">${escapeHtml(item.text)}</p>
            <div class="item-controls">
              <button type="button" data-speak="${escapeAttribute(item.text)}">Read aloud</button>
            </div>
          </div>
          <div class="choice-row" data-choice-row="${item.id}">
            ${renderChoice(item.id, "done", "Done", itemState.status)}
            ${renderChoice(item.id, "not-done", "Not done", itemState.status)}
            ${renderChoice(item.id, "skip", "Skip", itemState.status)}
          </div>
          <textarea data-comment="${item.id}" placeholder="Add comments, bug notes, device info, or follow-up...">${escapeHtml(itemState.comment || "")}</textarea>
        </article>
      `;
    }

    function renderChoice(itemId, value, label, current) {
      const checked = current === value ? "checked" : "";
      const active = current === value ? "active" : "";
      return `
        <label data-status="${value}" class="${active}">
          <input type="radio" name="status-${itemId}" value="${value}" data-status-input="${itemId}" ${checked} />
          <span>${label}</span>
        </label>
      `;
    }

    function bindInteractiveControls() {
      document.querySelectorAll("[data-speak]").forEach((button) => {
        button.addEventListener("click", () => speak(button.getAttribute("data-speak")));
      });

      document.querySelectorAll("[data-status-input]").forEach((input) => {
        input.addEventListener("change", () => {
          const itemId = input.getAttribute("data-status-input");
          updateItemState(itemId, { status: input.value });
          updateChoiceRow(itemId);
          renderSummary();
        });
      });

      document.querySelectorAll("[data-comment]").forEach((textarea) => {
        textarea.addEventListener("input", () => {
          updateItemState(textarea.getAttribute("data-comment"), { comment: textarea.value });
          renderSummary();
        });
      });
    }

    function updateChoiceRow(itemId) {
      const row = document.querySelector(`[data-choice-row="${CSS.escape(itemId)}"]`);
      if (!row) return;
      const itemState = getItemState(itemId);
      row.querySelectorAll("label").forEach((label) => {
        label.classList.toggle("active", label.getAttribute("data-status") === itemState.status);
      });
    }

    function matchesFilters(item, sectionTitle, groupTitle, query, sectionFilter, statusFilter) {
      const itemState = getItemState(item.id);
      const textBlob = [sectionTitle, groupTitle, item.text, itemState.comment || ""].join(" ").toLowerCase();
      const matchesQuery = !query || textBlob.includes(query);
      const matchesSection = sectionFilter === "all" || sectionTitle === sectionFilter;
      const matchesStatus =
        statusFilter === "all" ||
        (statusFilter === "todo" && !itemState.status) ||
        (statusFilter === "commented" && !!(itemState.comment || "").trim()) ||
        itemState.status === statusFilter;

      return matchesQuery && matchesSection && matchesStatus;
    }

    function speak(text) {
      if (!("speechSynthesis" in window) || typeof window.SpeechSynthesisUtterance === "undefined") {
        window.alert("This browser does not support read aloud.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function parseChecklist(md) {
      const lines = md.split(/\r?\n/);
      const sections = [];
      let currentSection = null;
      let currentGroup = null;
      let itemIndex = 0;

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        if (line.startsWith("## ")) {
          currentSection = { title: line.replace(/^##\s+/, ""), groups: [] };
          sections.push(currentSection);
          currentGroup = null;
          continue;
        }
        if (line.startsWith("### ")) {
          if (!currentSection) continue;
          currentGroup = { title: line.replace(/^###\s+/, ""), items: [] };
          currentSection.groups.push(currentGroup);
          continue;
        }
        if (line.startsWith("- [ ] ")) {
          if (!currentSection) continue;
          if (!currentGroup) {
            currentGroup = { title: "Checklist", items: [] };
            currentSection.groups.push(currentGroup);
          }
          const text = line.replace(/^- \[ \]\s+/, "");
          const id = `item-${++itemIndex}`;
          currentGroup.items.push({ id, text });
        }
      }

      return { sections };
    }

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"items":{}}');
      } catch (error) {
        return { items: {} };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getItemState(itemId) {
      if (!state.items[itemId]) state.items[itemId] = { status: "", comment: "" };
      return state.items[itemId];
    }

    function updateItemState(itemId, patch) {
      state.items[itemId] = { ...getItemState(itemId), ...patch };
      saveState();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }
  </script>
