<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="1800" viewBox="0 0 2400 1800">
  <defs>
    <!-- Skin color gradient -->
    <radialGradient id="skinGrad" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FDEBD8"/>
      <stop offset="100%" stop-color="#F0C8A0"/>
    </radialGradient>

    <!-- Crown gradient -->
    <linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE040"/>
      <stop offset="40%" stop-color="#F5C400"/>
      <stop offset="100%" stop-color="#D4A000"/>
    </linearGradient>

    <!-- Ear pink gradient -->
    <radialGradient id="earPinkGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F5A0A0"/>
      <stop offset="100%" stop-color="#E88080"/>
    </radialGradient>

    <!-- Cheek blush -->
    <radialGradient id="blushGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F0908C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0908C" stop-opacity="0"/>
    </radialGradient>

    <!-- Eye gradient -->
    <radialGradient id="eyeGrad" cx="0.4" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#5A3A28"/>
      <stop offset="100%" stop-color="#2A1810"/>
    </radialGradient>

    <!-- Green shawl gradient -->
    <linearGradient id="shawlGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#5DBF5D"/>
      <stop offset="100%" stop-color="#3A9A3A"/>
    </linearGradient>

    <!-- Yellow dhoti gradient -->
    <linearGradient id="dhotiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E0B000"/>
    </linearGradient>

    <!-- Ground shadow -->
    <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gem gradient -->
    <radialGradient id="gemGrad" cx="0.4" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#E03030"/>
      <stop offset="100%" stop-color="#B01515"/>
    </radialGradient>

    <!-- Bowl gradient -->
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE040"/>
      <stop offset="100%" stop-color="#D4A000"/>
    </linearGradient>

    <!-- Modak gradient -->
    <radialGradient id="modakGrad" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#FFE555"/>
      <stop offset="100%" stop-color="#E8B800"/>
    </radialGradient>

    <!-- Arm skin gradient (lighter) -->
    <radialGradient id="armSkinGrad" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#FDEBD8"/>
      <stop offset="100%" stop-color="#EEC8A0"/>
    </radialGradient>
  </defs>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- BLACK BACKGROUND -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <rect width="2400" height="1800" fill="#000000"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- GROUND SHADOW -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <ellipse cx="1200" cy="1540" rx="250" ry="40" fill="url(#groundShadow)"/>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- GREEN SHAWL (behind body, visible on sides) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="shawl">
    <!-- Single large shawl shape behind the body -->
    <path d="M 1050,760
             Q 1000,780 940,850
             Q 890,940 880,1050
             Q 880,1160 920,1250
             Q 960,1300 1020,1320
             L 1060,1300
             Q 1100,1280 1120,1200
             Q 1140,1100 1140,980
             Q 1130,880 1100,800 Z"
          fill="url(#shawlGrad)" stroke="#3A8A3A" stroke-width="2.5"/>
    <path d="M 1350,760
             Q 1400,780 1460,850
             Q 1510,940 1520,1050
             Q 1520,1160 1480,1250
             Q 1440,1300 1380,1320
             L 1340,1300
             Q 1300,1280 1280,1200
             Q 1260,1100 1260,980
             Q 1270,880 1300,800 Z"
          fill="url(#shawlGrad)" stroke="#3A8A3A" stroke-width="2.5"/>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- BODY / TORSO (chubby, shorter) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="body">
    <!-- Main torso - round and chubby -->
    <ellipse cx="1200" cy="960" rx="160" ry="210" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="3"/>

    <!-- Belly button -->
    <ellipse cx="1200" cy="1060" rx="7" ry="9" fill="#D4A070" opacity="0.5"/>

    <!-- Necklace -->
    <path d="M 1100,800 Q 1140,835 1200,845 Q 1260,835 1300,800"
          fill="none" stroke="#E8A800" stroke-width="5"/>
    <!-- Necklace pendant (gold circle) -->
    <circle cx="1200" cy="855" r="20" fill="#FFD700" stroke="#C89000" stroke-width="3"/>
    <circle cx="1200" cy="855" r="10" fill="#E8B000" stroke="#C08000" stroke-width="1.5"/>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- YELLOW DHOTI (pants) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="dhoti">
    <!-- Belt -->
    <rect x="1065" y="1130" width="270" height="40" rx="10" fill="#FFD700" stroke="#C89000" stroke-width="2.5"/>
    <!-- Belt studs -->
    <circle cx="1140" cy="1150" r="9" fill="#E8B000" stroke="#B88800" stroke-width="2"/>
    <circle cx="1200" cy="1150" r="9" fill="#E8B000" stroke="#B88800" stroke-width="2"/>
    <circle cx="1260" cy="1150" r="9" fill="#E8B000" stroke="#B88800" stroke-width="2"/>

    <!-- Left leg -->
    <path d="M 1090,1170
             Q 1075,1250 1070,1340
             Q 1065,1420 1075,1460
             Q 1090,1490 1120,1490
             Q 1155,1490 1170,1460
             Q 1180,1420 1175,1340
             Q 1170,1250 1160,1170 Z"
          fill="url(#dhotiGrad)" stroke="#C89000" stroke-width="2.5"/>
    <!-- Fold lines -->
    <path d="M 1105,1230 Q 1110,1330 1108,1420" fill="none" stroke="#C89000" stroke-width="2" opacity="0.4"/>
    <path d="M 1140,1220 Q 1145,1330 1142,1430" fill="none" stroke="#C89000" stroke-width="2" opacity="0.35"/>

    <!-- Right leg -->
    <path d="M 1240,1170
             Q 1230,1250 1225,1340
             Q 1220,1420 1230,1460
             Q 1245,1490 1280,1490
             Q 1310,1490 1325,1460
             Q 1335,1420 1330,1340
             Q 1325,1250 1310,1170 Z"
          fill="url(#dhotiGrad)" stroke="#C89000" stroke-width="2.5"/>
    <!-- Fold lines -->
    <path d="M 1260,1220 Q 1258,1330 1260,1430" fill="none" stroke="#C89000" stroke-width="2" opacity="0.35"/>
    <path d="M 1295,1230 Q 1293,1330 1295,1420" fill="none" stroke="#C89000" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- FEET (round, cute, skin colored) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="feet">
    <!-- Left foot -->
    <ellipse cx="1120" cy="1505" rx="60" ry="22" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2.5"/>
    <!-- Toes -->
    <circle cx="1075" cy="1500" r="8" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="1.5"/>
    <circle cx="1090" cy="1495" r="7" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="1.5"/>
    <circle cx="1105" cy="1493" r="6.5" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="1.5"/>

    <!-- Right foot -->
    <ellipse cx="1280" cy="1505" rx="60" ry="22" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2.5"/>
    <!-- Toes -->
    <circle cx="1325" cy="1500" r="8" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="1.5"/>
    <circle cx="1310" cy="1495" r="7" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="1.5"/>
    <circle cx="1295" cy="1493" r="6.5" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="1.5"/>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- LEFT ARM (blessing hand / abhaya mudra) - CHUBBY -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="leftArm">
    <!-- Chubby upper arm shape -->
    <path d="M 1060,820
             Q 1020,810 970,790
             Q 920,770 870,750
             Q 840,740 830,750
             Q 820,765 830,785
             Q 850,810 870,820
             Q 920,840 970,850
             Q 1020,860 1060,870 Z"
          fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2.5"/>

    <!-- Gold bracelet on wrist -->
    <ellipse cx="845" cy="765" rx="30" ry="12" fill="#FFD700" stroke="#C89000" stroke-width="3"/>

    <!-- Open palm (blessing gesture) -->
    <g transform="translate(820,710)">
      <!-- Palm -->
      <ellipse cx="0" cy="0" rx="42" ry="50" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2.5"/>
      <!-- Fingers -->
      <path d="M -22,-40 Q -24,-65 -18,-80 Q -12,-65 -14,-40" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2"/>
      <path d="M -6,-45 Q -8,-75 -2,-90 Q 4,-75 2,-45" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2"/>
      <path d="M 10,-45 Q 8,-75 14,-90 Q 20,-75 18,-45" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2"/>
      <path d="M 25,-38 Q 24,-62 30,-75 Q 36,-62 34,-38" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2"/>
      <!-- Thumb -->
      <path d="M 35,-10 Q 52,-18 55,-5 Q 52,8 40,14" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2"/>
      <!-- Palm lines -->
      <path d="M -15,5 Q 0,-2 15,5" fill="none" stroke="#DDA878" stroke-width="1.5" opacity="0.5"/>
      <path d="M -10,15 Q 0,10 10,15" fill="none" stroke="#DDA878" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- RIGHT ARM (holding bowl of modaks) - CHUBBY -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="rightArm">
    <!-- Chubby upper arm shape -->
    <path d="M 1340,820
             Q 1380,810 1430,790
             Q 1480,770 1530,750
             Q 1560,740 1570,750
             Q 1580,765 1570,785
             Q 1550,810 1530,820
             Q 1480,840 1430,850
             Q 1380,860 1340,870 Z"
          fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2.5"/>

    <!-- Gold bracelet on wrist -->
    <ellipse cx="1555" cy="765" rx="30" ry="12" fill="#FFD700" stroke="#C89000" stroke-width="3"/>

    <!-- Hand (cupped, holding bowl) -->
    <path d="M 1540,740 Q 1530,720 1540,700 Q 1555,690 1575,700 Q 1585,720 1575,740"
          fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2.5"/>

    <!-- Bowl -->
    <path d="M 1500,700
             Q 1495,670 1520,650
             Q 1555,635 1590,650
             Q 1615,670 1610,700
             Q 1600,730 1570,740
             Q 1555,745 1540,740
             Q 1510,730 1500,700 Z"
          fill="url(#bowlGrad)" stroke="#B88800" stroke-width="3"/>
    <!-- Bowl rim -->
    <ellipse cx="1555" cy="655" rx="60" ry="14" fill="#FFE555" stroke="#C89000" stroke-width="2"/>

    <!-- Modaks (round sweets) piled in bowl -->
    <circle cx="1535" cy="640" r="18" fill="url(#modakGrad)" stroke="#C89000" stroke-width="2"/>
    <circle cx="1570" cy="638" r="17" fill="url(#modakGrad)" stroke="#C89000" stroke-width="2"/>
    <circle cx="1550" cy="620" r="16" fill="url(#modakGrad)" stroke="#C89000" stroke-width="2"/>
    <circle cx="1580" cy="625" r="14" fill="url(#modakGrad)" stroke="#C89000" stroke-width="2"/>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- HEAD (BIG - chibi style) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="head">
    <!-- Main head - large round shape -->
    <ellipse cx="1200" cy="520" rx="250" ry="245" fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="3"/>

    <!-- ── LEFT EAR (big, round, floppy) ── -->
    <path d="M 970,440
             Q 890,380 820,420
             Q 760,480 770,570
             Q 790,660 870,690
             Q 940,700 980,660
             Q 1000,620 990,540 Z"
          fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="3"/>
    <!-- Left ear inner pink -->
    <path d="M 960,470
             Q 900,420 850,455
             Q 810,500 820,570
             Q 840,640 900,660
             Q 945,670 970,640
             Q 985,600 975,530 Z"
          fill="url(#earPinkGrad)" opacity="0.65"/>

    <!-- ── RIGHT EAR (big, round, floppy) ── -->
    <path d="M 1430,440
             Q 1510,380 1580,420
             Q 1640,480 1630,570
             Q 1610,660 1530,690
             Q 1460,700 1420,660
             Q 1400,620 1410,540 Z"
          fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="3"/>
    <!-- Right ear inner pink -->
    <path d="M 1440,470
             Q 1500,420 1550,455
             Q 1590,500 1580,570
             Q 1560,640 1500,660
             Q 1455,670 1430,640
             Q 1415,600 1425,530 Z"
          fill="url(#earPinkGrad)" opacity="0.65"/>

    <!-- ── EYES (big anime style) ── -->
    <!-- Left eye -->
    <ellipse cx="1110" cy="530" rx="52" ry="56" fill="white" stroke="#3A2820" stroke-width="3.5"/>
    <ellipse cx="1115" cy="538" rx="34" ry="38" fill="url(#eyeGrad)"/>
    <circle cx="1103" cy="520" r="14" fill="white" opacity="0.9"/>
    <circle cx="1125" cy="548" r="7" fill="white" opacity="0.5"/>

    <!-- Right eye -->
    <ellipse cx="1290" cy="530" rx="52" ry="56" fill="white" stroke="#3A2820" stroke-width="3.5"/>
    <ellipse cx="1285" cy="538" rx="34" ry="38" fill="url(#eyeGrad)"/>
    <circle cx="1278" cy="520" r="14" fill="white" opacity="0.9"/>
    <circle cx="1295" cy="548" r="7" fill="white" opacity="0.5"/>

    <!-- ── EYEBROWS (subtle arches) ── -->
    <path d="M 1062,475 Q 1090,455 1130,460" fill="none" stroke="#5A3828" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 1338,475 Q 1310,455 1270,460" fill="none" stroke="#5A3828" stroke-width="5.5" stroke-linecap="round"/>

    <!-- ── CHEEK BLUSH ── -->
    <ellipse cx="1060" cy="595" rx="42" ry="30" fill="url(#blushGrad)"/>
    <ellipse cx="1340" cy="595" rx="42" ry="30" fill="url(#blushGrad)"/>

    <!-- ── TRUNK (prominent, curling right) ── -->
    <!-- Trunk base connects between/below the eyes -->
    <path d="M 1175,580
             Q 1180,610 1185,650
             Q 1190,690 1200,720
             Q 1215,755 1240,775
             Q 1270,790 1300,780
             Q 1320,770 1325,750
             Q 1315,740 1295,750
             Q 1270,760 1245,750
             Q 1225,735 1215,710
             Q 1205,680 1200,640
             Q 1195,610 1190,580"
          fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="3"/>
    <!-- Trunk tip curl -->
    <path d="M 1300,780 Q 1330,790 1340,775 Q 1335,758 1318,755"
          fill="url(#skinGrad)" stroke="#DDAD85" stroke-width="2.5"/>
    <!-- Trunk ridges -->
    <path d="M 1178,620 Q 1190,615 1192,620" fill="none" stroke="#DDAD85" stroke-width="1.5" opacity="0.5"/>
    <path d="M 1182,650 Q 1195,645 1198,650" fill="none" stroke="#DDAD85" stroke-width="1.5" opacity="0.5"/>
    <path d="M 1188,680 Q 1202,675 1206,680" fill="none" stroke="#DDAD85" stroke-width="1.5" opacity="0.5"/>

    <!-- ── SMILE ── -->
    <path d="M 1155,640 Q 1170,660 1185,655" fill="none" stroke="#DDAD85" stroke-width="3" stroke-linecap="round"/>

    <!-- ── OM SYMBOL on forehead ── -->
    <text x="1200" y="460" text-anchor="middle" dominant-baseline="central"
          font-family="serif" font-size="55" font-weight="bold" fill="#E83820">ॐ</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- CROWN / MUKUT (golden, ornate) -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g id="crown">
    <!-- Crown base band (sits on head) -->
    <path d="M 1060,380
             Q 1060,345 1100,330
             L 1300,330
             Q 1340,345 1340,380
             Q 1300,400 1200,405
             Q 1100,400 1060,380 Z"
          fill="url(#crownGrad)" stroke="#B88800" stroke-width="3"/>

    <!-- Decorative bumps on crown base -->
    <circle cx="1130" cy="358" r="11" fill="#E8B000" stroke="#B88800" stroke-width="2"/>
    <circle cx="1200" cy="352" r="12" fill="#E8B000" stroke="#B88800" stroke-width="2"/>
    <circle cx="1270" cy="358" r="11" fill="#E8B000" stroke="#B88800" stroke-width="2"/>

    <!-- Crown dome -->
    <path d="M 1110,335
             Q 1105,280 1130,240
             Q 1160,205 1200,190
             Q 1240,205 1270,240
             Q 1295,280 1290,335 Z"
          fill="url(#crownGrad)" stroke="#B88800" stroke-width="3"/>

    <!-- Crown vertical ridges -->
    <path d="M 1155,330 Q 1150,280 1160,240" fill="none" stroke="#C89800" stroke-width="2" opacity="0.5"/>
    <path d="M 1200,330 Q 1200,270 1200,230" fill="none" stroke="#C89800" stroke-width="2" opacity="0.5"/>
    <path d="M 1245,330 Q 1250,280 1240,240" fill="none" stroke="#C89800" stroke-width="2" opacity="0.5"/>

    <!-- Crown horizontal line -->
    <path d="M 1125,290 Q 1200,280 1275,290" fill="none" stroke="#C89800" stroke-width="2" opacity="0.5"/>

    <!-- Crown finial / spire -->
    <path d="M 1180,195 Q 1188,160 1200,140 Q 1212,160 1220,195"
          fill="url(#crownGrad)" stroke="#B88800" stroke-width="2.5"/>
    <!-- Finial top ball -->
    <circle cx="1200" cy="132" r="18" fill="#FFD700" stroke="#B88800" stroke-width="2.5"/>
    <!-- Ball highlight -->
    <circle cx="1195" cy="127" r="6" fill="#FFF0A0" opacity="0.6"/>

    <!-- Central red gem (teardrop shape) -->
    <path d="M 1200,305
             Q 1180,320 1180,340
             Q 1180,355 1200,365
             Q 1220,355 1220,340
             Q 1220,320 1200,305 Z"
          fill="url(#gemGrad)" stroke="#8B0000" stroke-width="2"/>
    <!-- Gem highlight -->
    <ellipse cx="1196" cy="330" rx="7" ry="10" fill="white" opacity="0.3"/>
  </g>

</svg>
