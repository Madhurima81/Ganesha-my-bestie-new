<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ganesha My Bestie — No Internet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', 'Baloo 2', sans-serif;
      background: #FFF8E7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(255, 107, 53, 0.15);
      border: 3px solid #FFD97D;
    }

    .elephant {
      font-size: 80px;
      margin-bottom: 16px;
      animation: sway 2.5s ease-in-out infinite;
      display: block;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50%       { transform: rotate(5deg); }
    }

    h1 {
      font-size: 1.6rem;
      color: #FF6B35;
      margin-bottom: 10px;
      font-weight: 800;
    }

    p {
      font-size: 1rem;
      color: #6B5B45;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .tip {
      background: #FFF3DC;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 0.9rem;
      color: #9B6A00;
      margin-bottom: 28px;
    }

    button {
      background: #FF6B35;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    button:hover  { background: #e85c28; transform: scale(1.04); }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <span class="elephant">🐘</span>
    <h1>Oops! No Internet</h1>
    <p>
      Ganesha is waiting for you, but it looks like the Wi-Fi went on a little adventure too!
    </p>
    <div class="tip">
      💡 Check your Wi-Fi or mobile data, then tap the button below to try again.
    </div>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
