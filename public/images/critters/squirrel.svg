<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 108">
  <!-- Tail (big fluffy arc - drawn first so body sits on top) -->
  <path d="M22,90 Q2,52 18,22 Q40,0 65,18 Q80,36 68,60 Q58,76 48,84"
        stroke="#C17A38" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M22,90 Q2,52 18,22 Q40,0 65,18 Q80,36 68,60 Q58,76 48,84"
        stroke="#D99048" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="52" cy="74" rx="21" ry="24" fill="#C17A38"/>
  <!-- Belly -->
  <ellipse cx="52" cy="80" rx="13" ry="17" fill="#EAC080"/>
  <!-- Head -->
  <circle cx="50" cy="47" r="21" fill="#C17A38"/>
  <!-- Face/muzzle -->
  <ellipse cx="55" cy="55" rx="11" ry="9" fill="#EAC080"/>
  <!-- Left ear -->
  <ellipse cx="34" cy="31" rx="8" ry="11" transform="rotate(-18 34 31)" fill="#C17A38"/>
  <ellipse cx="34" cy="31" rx="5" ry="7" transform="rotate(-18 34 31)" fill="#EABCB0"/>
  <!-- Right ear -->
  <ellipse cx="63" cy="29" rx="8" ry="11" transform="rotate(18 63 29)" fill="#C17A38"/>
  <ellipse cx="63" cy="29" rx="5" ry="7" transform="rotate(18 63 29)" fill="#EABCB0"/>
  <!-- Eyes -->
  <circle cx="42" cy="44" r="5.5" fill="#1A1A1A"/>
  <circle cx="43.5" cy="42.5" r="2" fill="white"/>
  <circle cx="59" cy="43" r="5.5" fill="#1A1A1A"/>
  <circle cx="60.5" cy="41.5" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="54" cy="53" rx="3.5" ry="2.5" fill="#8B4513"/>
  <!-- Arms -->
  <path d="M36,68 Q24,72 27,84" stroke="#C17A38" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M67,68 Q79,72 74,84" stroke="#C17A38" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Acorn cap -->
  <ellipse cx="51" cy="86" rx="11" ry="6" fill="#8B5E3C"/>
  <!-- Acorn cap texture -->
  <path d="M42,85 Q51,81 60,85" stroke="#6B4020" stroke-width="1.5" fill="none"/>
  <path d="M41,87 Q51,83 61,87" stroke="#6B4020" stroke-width="1" fill="none"/>
  <!-- Acorn body -->
  <ellipse cx="51" cy="94" rx="9" ry="11" fill="#C8973A"/>
  <!-- Acorn shine -->
  <ellipse cx="48" cy="90" rx="3" ry="4" fill="rgba(255,220,120,0.3)"/>
</svg>
