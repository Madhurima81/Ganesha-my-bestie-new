<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123">
<defs>
<style>
.title{font-family:Nunito,Quicksand,sans-serif;font-weight:700;fill:#7B4F3A}
.body{font-family:Nunito,Quicksand,sans-serif;fill:#6B554B}
.small{font-family:Nunito,Quicksand,sans-serif;font-size:13px;fill:#806B60}
.slot{fill:none;stroke:#E6B8B8;stroke-width:1.5;stroke-dasharray:6 5}
.cut{fill:none;stroke:#D99090;stroke-width:1.4;stroke-dasharray:7 5}
</style>
</defs>

<rect width="794" height="1123" fill="#FFFDF8"/>
<rect x="24" y="24" width="746" height="1075" rx="24" fill="#FFFDF8" stroke="#F0D9CD" stroke-width="2"/>

<!-- TITLE -->
<g id="slot-title">
<text id="TITLE" x="397" y="78" text-anchor="middle" class="title" font-size="31">{{TITLE}}</text>
<text id="SUBTITLE" x="397" y="105" text-anchor="middle" class="body" font-size="15">{{SUBTITLE}}</text>
</g>

<!-- INSTRUCTIONS -->
<g id="instructions">
<rect x="55" y="130" width="684" height="112" rx="20" fill="#FFF3E5" stroke="#F0D8C7"/>
<text x="397" y="153" text-anchor="middle" class="title" font-size="16">HOW TO MAKE IT</text>
<g id="slot-instructions">
<circle cx="92" cy="186" r="16" fill="#F8BBD0"/><text x="92" y="191" text-anchor="middle" class="title" font-size="14">1</text>
<text id="INSTRUCTION_1" x="120" y="185" class="body" font-size="14">{{INSTRUCTION_1}}</text>
<text id="INSTRUCTION_1B" x="120" y="205" class="small">{{INSTRUCTION_1B}}</text>
<circle cx="282" cy="186" r="16" fill="#CDEFD9"/><text x="282" y="191" text-anchor="middle" class="title" font-size="14">2</text>
<text id="INSTRUCTION_2" x="310" y="185" class="body" font-size="14">{{INSTRUCTION_2}}</text>
<text id="INSTRUCTION_2B" x="310" y="205" class="small">{{INSTRUCTION_2B}}</text>
<circle cx="472" cy="186" r="16" fill="#F9E3A8"/><text x="472" y="191" text-anchor="middle" class="title" font-size="14">3</text>
<text id="INSTRUCTION_3" x="500" y="185" class="body" font-size="14">{{INSTRUCTION_3}}</text>
<text id="INSTRUCTION_3B" x="500" y="205" class="small">{{INSTRUCTION_3B}}</text>
<circle cx="662" cy="186" r="16" fill="#D9D0ED"/><text x="662" y="191" text-anchor="middle" class="title" font-size="14">4</text>
<text id="INSTRUCTION_4" x="690" y="185" class="body" font-size="14">{{INSTRUCTION_4}}</text>
<text id="INSTRUCTION_4B" x="690" y="205" class="small">{{INSTRUCTION_4B}}</text>
</g></g>

<!-- THREE BAND OPTIONS -->
<g id="craft-area">
<rect x="58" y="275" width="678" height="116" rx="58" fill="#FFF0D8" stroke="#DDBEA7" stroke-width="2"/>
<rect x="65" y="282" width="664" height="102" rx="51" class="cut"/>
<circle cx="88" cy="333" r="10" fill="#FFFDF8" stroke="#DDBEA7" stroke-width="2"/>
<circle cx="706" cy="333" r="10" fill="#FFFDF8" stroke="#DDBEA7" stroke-width="2"/>
<text id="BAND_DECOR_TOP" x="397" y="345" text-anchor="middle" class="body" font-size="17">{{BAND_DECOR_TOP}}</text>

<rect x="58" y="415" width="678" height="116" rx="58" fill="#EDE7F6" stroke="#CFC4E0" stroke-width="2"/>
<rect x="65" y="422" width="664" height="102" rx="51" class="cut"/>
<circle cx="88" cy="473" r="10" fill="#FFFDF8" stroke="#CFC4E0" stroke-width="2"/>
<circle cx="706" cy="473" r="10" fill="#FFFDF8" stroke="#CFC4E0" stroke-width="2"/>
<text id="BAND_TEXT" x="397" y="485" text-anchor="middle" class="title" font-size="27">{{BAND_TEXT}}</text>

<rect x="58" y="555" width="678" height="116" rx="58" fill="#E4F1E3" stroke="#BDD4BA" stroke-width="2"/>
<rect x="65" y="562" width="664" height="102" rx="51" class="cut"/>
<circle cx="88" cy="613" r="10" fill="#FFFDF8" stroke="#BDD4BA" stroke-width="2"/>
<circle cx="706" cy="613" r="10" fill="#FFFDF8" stroke="#BDD4BA" stroke-width="2"/>
<text id="BAND_DECOR_BOTTOM" x="397" y="625" text-anchor="middle" class="body" font-size="17">{{BAND_DECOR_BOTTOM}}</text>
</g>

<!-- CHARACTER / WISDOM / CLUE -->
<g id="slot-character-main">
<rect x="75" y="705" width="235" height="225" rx="24" class="slot"/>
<text x="192" y="808" text-anchor="middle" class="small">ASSET SLOT</text>
<text id="CHARACTER_MAIN" x="192" y="830" text-anchor="middle" class="small">{{CHARACTER_MAIN}}</text>
</g>

<g id="slot-wisdom">
<rect x="330" y="720" width="185" height="170" rx="22" fill="#FFF3E5" stroke="#E7D2C2"/>
<text x="422" y="748" text-anchor="middle" class="title" font-size="14">WISDOM REMINDER</text>
<text id="WISDOM_TEXT" x="422" y="790" text-anchor="middle" class="body" font-size="17">{{WISDOM_TEXT}}</text>
</g>

<g id="slot-clue">
<rect x="535" y="720" width="185" height="170" rx="22" class="slot"/>
<text x="627" y="748" text-anchor="middle" class="title" font-size="14">OPTIONAL CLUE</text>
<text id="CLUE_TEXT" x="627" y="790" text-anchor="middle" class="body" font-size="15">{{CLUE_TEXT}}</text>
</g>

<!-- FOOTER -->
<line x1="55" y1="963" x2="739" y2="963" stroke="#E6D6CC" stroke-width="1.5"/>
<text id="FOOTER_PROMPT" x="397" y="1000" text-anchor="middle" class="title" font-size="18">{{FOOTER_PROMPT}}</text>
<text id="FOOTER_SMALL" x="397" y="1025" text-anchor="middle" class="small">{{FOOTER_SMALL}}</text>
<text x="397" y="1065" text-anchor="middle" class="small">Prana Kids • Print at 100% • Cut on dotted lines</text>
</svg>